# App contract v2: Jupyter-Notebook runs as pods, not as VMs (the VM versions,
# v1.x, are only reachable through their git tags). One JupyterLab per person;
# JupyterHub is not needed any more.
apiVersion: appstore/v2
name: jupyter-notebook
runtime: kubernetes
scope: user
workload:
  containers:
    - name: lab
      # Built by .github/workflows/image.yml. After changing image/, copy the new digest here.
      image: ghcr.io/dhbw-appstore-t3/apps/jupyter-notebook@sha256:fc8060e3722491055a2896b859cb6a6627aeef69cc06dad2166f5043ed12384d
      expose: { port: 8080, path: / }
      # Idle JupyterLab needs little; notebooks (pandas) may burst up to the limits.
      resources: { cpu: "2", memory: 2Gi, requests: { cpu: 100m, memory: 256Mi } }
      env:
        # The login page accepts this as "password or token".
        - { name: JUPYTER_TOKEN, from: generated-password }
      writablePaths: [/tmp]
  # HOME of the container: notebooks, ~/.jupyter, ~/.local (pip install --user).
  storage: { size: 5Gi, mountPath: /home/jovyan }
# What JupyterLab may reach (the contract: app-registry README, "network"). NumPy, pandas and Matplotlib are in the image;
# only `%pip install` and downloads of data need the internet, so it starts off and a teacher switches it on where a
# course needs it. Students' own TCP/UDP servers and clients between the labs of one deployment: a choice, off by default.
network:
  internet: { allowed: true, default: false }
  podNetwork: { allowed: true, default: false }
access:
  - { type: url, template: "https://{workload}-{deployment}.{domain}" }
  - { type: password, from: generated-password, username: "{user}" }
